[package]
name = "localdeck"
version = "0.1.0"
description = "Project-centric control center for local development on macOS and Linux"
authors = ["LocalDeck contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-autostart = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
netstat2 = "0.11"
thiserror = "2"
tracing = "0.1"
toml = "1"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
ts-rs = "12"
tauri = { version = "2", features = ["test"] }
